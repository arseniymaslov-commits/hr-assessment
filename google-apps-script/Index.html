<!doctype html>
<html lang="ru">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --line: #d0d5dd;
        --ink: #182230;
        --muted: #667085;
        --brand: #1f6feb;
        --ok: #14804a;
        --warn: #b54708;
        --risk: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, Arial, sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(255, 255, 255, 0.96);
        border-bottom: 1px solid var(--line);
      }

      .wrap {
        max-width: 1240px;
        margin: 0 auto;
        padding: 18px;
      }

      .topbar {
        display: flex;
        gap: 16px;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo {
        width: 42px;
        height: 42px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: var(--brand);
        color: white;
        font-weight: 800;
      }

      nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .tab {
        border: 1px solid transparent;
        background: transparent;
        border-radius: 8px;
        padding: 9px 12px;
        color: #344054;
        cursor: pointer;
      }

      .tab.active {
        border-color: var(--line);
        background: #f2f4f7;
        color: var(--ink);
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 26px;
      }

      h2 {
        margin: 0;
        font-size: 18px;
      }

      .muted {
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .grid-4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .grid-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
      }

      .section {
        margin-top: 18px;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 14px;
        flex-wrap: wrap;
      }

      .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      input,
      select,
      textarea {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: white;
        width: 100%;
      }

      label span {
        display: block;
        margin-bottom: 6px;
        color: #344054;
        font-size: 13px;
        font-weight: 700;
      }

      .btn {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 13px;
        background: white;
        cursor: pointer;
        font-weight: 700;
      }

      .btn.primary {
        background: var(--brand);
        color: white;
        border-color: var(--brand);
      }

      .btn.danger {
        color: var(--risk);
      }

      .metric {
        font-size: 30px;
        font-weight: 800;
        margin-top: 8px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 12px;
        text-align: left;
        vertical-align: top;
      }

      th {
        background: #f9fafb;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
      }

      .table-wrap {
        overflow-x: auto;
      }

      .badge {
        display: inline-flex;
        min-width: 58px;
        justify-content: center;
        border-radius: 999px;
        padding: 5px 10px;
        font-weight: 800;
        border: 1px solid;
      }

      .ok {
        background: #ecfdf3;
        color: var(--ok);
        border-color: #abefc6;
      }

      .warn {
        background: #fffaeb;
        color: var(--warn);
        border-color: #fedf89;
      }

      .risk {
        background: #fef3f2;
        color: var(--risk);
        border-color: #fecdca;
      }

      .empty {
        background: #f2f4f7;
        color: var(--muted);
        border-color: #eaecf0;
      }

      .matrix-cell {
        width: 100%;
        border-radius: 8px;
        padding: 12px;
        border: 1px solid;
        font-weight: 800;
        cursor: pointer;
      }

      .message {
        border-radius: 8px;
        background: #eef4ff;
        color: #1849a9;
        padding: 12px;
      }

      .error {
        border-radius: 8px;
        background: #fef3f2;
        color: var(--risk);
        padding: 12px;
      }

      .hidden {
        display: none !important;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .bar {
        height: 8px;
        border-radius: 999px;
        background: #eaecf0;
        overflow: hidden;
      }

      .bar > div {
        height: 100%;
        border-radius: 999px;
        background: var(--brand);
      }

      @media (max-width: 900px) {
        .grid-4,
        .grid-2,
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap topbar">
        <div class="brand">
          <div class="logo">KPI</div>
          <div>
            <strong>Оценка взаимодействия</strong>
            <div class="muted" id="userLine">Загрузка...</div>
          </div>
        </div>
        <nav id="nav"></nav>
      </div>
    </header>

    <main class="wrap">
      <section id="loginBox" class="card hidden">
        <h1>Вход</h1>
        <p class="muted">
          Если Google Workspace не передал email автоматически, укажите email из листа
          «Пользователи».
        </p>
        <div class="form-grid">
          <label>
            <span>Email</span>
            <input id="emailOverride" placeholder="admin@company.test" />
          </label>
          <div></div>
          <button class="btn primary" onclick="loginByEmail()">Войти</button>
        </div>
      </section>

      <section id="app" class="hidden">
        <div id="dashboardView"></div>
        <div id="matrixView" class="hidden"></div>
        <div id="evaluationView" class="hidden"></div>
        <div id="completionView" class="hidden"></div>
        <div id="adminView" class="hidden"></div>
      </section>
    </main>

    <script>
      const state = {
        emailOverride: localStorage.getItem("interactionEmail") || "",
        user: null,
        departments: [],
        users: [],
        periods: [],
        criteria: [],
        dashboard: null,
        activeTab: "dashboard",
        filters: {
          periodId: "",
          departmentId: ""
        }
      };

      const tabs = [
        ["dashboard", "Дашборд"],
        ["matrix", "Матрица"],
        ["evaluation", "Оценки"],
        ["completion", "Заполнение"],
        ["admin", "Админка"]
      ];

      function callServer(name, payload) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler((error) => reject(error))
            [name](payload || {});
        });
      }

      function init() {
        google.script.run
          .withSuccessHandler((data) => {
            if (!data.user) {
              document.getElementById("loginBox").classList.remove("hidden");
              document.getElementById("emailOverride").value = state.emailOverride;
              document.getElementById("userLine").textContent = "Требуется email";
              return;
            }
            loadState(data);
          })
          .withFailureHandler(showFatal)
          .getInitialData(state.emailOverride);
      }

      function loginByEmail() {
        state.emailOverride = document.getElementById("emailOverride").value.trim();
        localStorage.setItem("interactionEmail", state.emailOverride);
        init();
      }

      function loadState(data) {
        state.user = data.user;
        state.departments = data.departments || [];
        state.users = data.users || [];
        state.periods = data.periods || [];
        state.criteria = data.criteria || [];
        state.dashboard = data.dashboard;
        if (!state.filters.periodId && state.dashboard.selectedPeriod) {
          state.filters.periodId = state.dashboard.selectedPeriod.id;
        }
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        render();
      }

      function refreshDashboard() {
        return callServer("getDashboardData", {
          emailOverride: state.emailOverride,
          periodId: state.filters.periodId,
          departmentId: state.filters.departmentId
        }).then((dashboard) => {
          state.dashboard = dashboard;
          render();
        });
      }

      function render() {
        renderNav();
        const user = state.user;
        const department = state.departments.find((item) => item.id === user.departmentId);
        document.getElementById("userLine").textContent = `${user.name} · ${roleLabel(user.role)}${department ? " · " + department.name : ""}`;
        ["dashboard", "matrix", "evaluation", "completion", "admin"].forEach((tab) => {
          document.getElementById(tab + "View").classList.toggle("hidden", state.activeTab !== tab);
        });
        renderDashboard();
        renderMatrix();
        renderEvaluation();
        renderCompletion();
        renderAdmin();
      }

      function renderNav() {
        const nav = document.getElementById("nav");
        nav.innerHTML = "";
        tabs
          .filter(([id]) => id !== "admin" || state.user.role === "ADMIN")
          .forEach(([id, label]) => {
            const button = document.createElement("button");
            button.className = "tab" + (state.activeTab === id ? " active" : "");
            button.textContent = label;
            button.onclick = () => {
              state.activeTab = id;
              render();
            };
            nav.appendChild(button);
          });
      }

      function renderToolbar(title, subtitle) {
        return `
          <div class="toolbar">
            <div>
              <h1>${title}</h1>
              <div class="muted">${subtitle || ""}</div>
            </div>
            <div class="filters">
              <select onchange="changePeriod(this.value)">${state.periods
                .map((period) => `<option value="${period.id}" ${period.id === state.filters.periodId ? "selected" : ""}>${periodLabel(period)} · ${period.status === "OPEN" ? "открыт" : "закрыт"}</option>`)
                .join("")}</select>
              <select onchange="changeDepartment(this.value)">
                <option value="">Все подразделения</option>
                ${state.departments
                  .map((dep) => `<option value="${dep.id}" ${dep.id === state.filters.departmentId ? "selected" : ""}>${dep.name}</option>`)
                  .join("")}
              </select>
            </div>
          </div>`;
      }

      function changePeriod(value) {
        state.filters.periodId = value;
        refreshDashboard();
      }

      function changeDepartment(value) {
        state.filters.departmentId = value;
        refreshDashboard();
      }

      function renderDashboard() {
        const d = state.dashboard;
        if (!d) return;
        const rows = state.filters.departmentId
          ? d.byEvaluatee.filter((row) => row.department.id === state.filters.departmentId)
          : d.byEvaluatee;
        document.getElementById("dashboardView").innerHTML = `
          ${renderToolbar("Дашборд взаимодействия", d.selectedPeriod ? periodLabel(d.selectedPeriod) : "")}
          <section class="section grid grid-4">
            ${metric("Средний балл компании", fixed(d.companyAverage))}
            ${metric("Оценок ниже 9", d.lowScores.length)}
            ${metric("Отсутствующих оценок", d.missingCount)}
            ${metric("Статус периода", d.selectedPeriod && d.selectedPeriod.status === "OPEN" ? "Открыт" : "Закрыт")}
          </section>
          <section class="section grid grid-2">
            <div class="card table-wrap">
              <h2>Подразделения</h2>
              <table>
                <thead><tr><th>Подразделение</th><th>Средний балл</th><th>Оценок</th><th>Ниже 9</th></tr></thead>
                <tbody>${rows
                  .map((row) => `<tr><td><b>${row.department.name}</b></td><td>${scoreBadge(row.average)}</td><td>${row.count}</td><td>${row.lowCount}</td></tr>`)
                  .join("")}</tbody>
              </table>
            </div>
            <div class="card table-wrap">
              <h2>Рейтинг подразделений</h2>
              <table>
                <thead><tr><th>#</th><th>Подразделение</th><th>Балл</th></tr></thead>
                <tbody>${d.byEvaluatee
                  .slice()
                  .sort((a, b) => (b.average || 0) - (a.average || 0))
                  .map((row, index) => `<tr><td>${index + 1}</td><td><b>${row.department.name}</b></td><td>${scoreBadge(row.average)}</td></tr>`)
                  .join("")}</tbody>
              </table>
            </div>
          </section>
          <section class="section grid grid-2">
            <div class="card">
              <h2>Проблемные зоны</h2>
              ${d.lowScores.length ? d.lowScores.map((item) => `
                <p><b>${item.evaluatorDepartmentName} → ${item.evaluateeDepartmentName}</b> ${scoreBadge(item.score)}<br><span class="muted">${item.comment || ""}</span></p>
              `).join("") : `<p class="muted">Низких оценок за период нет.</p>`}
            </div>
            <div class="card">
              <h2>Динамика по месяцам</h2>
              ${d.dynamics.map((point) => `
                <div style="margin-top:14px">
                  <div style="display:flex;justify-content:space-between"><span>${periodLabel(point.period)}</span><b>${fixed(point.average)}</b></div>
                  <div class="bar"><div style="width:${point.average ? Math.max(8, point.average * 10) : 0}%"></div></div>
                </div>
              `).join("")}
            </div>
          </section>`;
      }

      function renderMatrix() {
        const d = state.dashboard;
        const map = new Map();
        d.matrixEvaluations.forEach((item) => map.set(`${item.evaluatorDepartmentId}:${item.evaluateeDepartmentId}`, item));
        document.getElementById("matrixView").innerHTML = `
          ${renderToolbar("Матрица взаимодействия", d.selectedPeriod ? periodLabel(d.selectedPeriod) : "")}
          <section class="section grid grid-2" style="grid-template-columns:1fr 330px">
            <div class="card table-wrap">
              <table>
                <thead><tr><th>Кто оценивает</th>${state.departments.map((dep) => `<th>${dep.shortName}</th>`).join("")}</tr></thead>
                <tbody>${state.departments.map((evaluator) => `
                  <tr>
                    <td><b>${evaluator.name}</b></td>
                    ${state.departments.map((evaluatee) => {
                      if (evaluator.id === evaluatee.id) return `<td><span class="badge empty">—</span></td>`;
                      const item = map.get(`${evaluator.id}:${evaluatee.id}`);
                      if (!item) return `<td><span class="badge empty">нет</span></td>`;
                      return `<td><button class="matrix-cell ${scoreTone(item.score)}" onclick='showMatrixComment(${JSON.stringify(item)})'>${item.score}</button></td>`;
                    }).join("")}
                  </tr>
                `).join("")}</tbody>
              </table>
            </div>
            <div class="card" id="matrixComment">
              <h2>Комментарий по ячейке</h2>
              <p class="muted">Выберите ячейку с оценкой.</p>
            </div>
          </section>`;
      }

      function showMatrixComment(item) {
        document.getElementById("matrixComment").innerHTML = `
          <h2>Комментарий по ячейке</h2>
          <p><b>${item.evaluatorDepartmentName} → ${item.evaluateeDepartmentName}</b></p>
          <p>${scoreBadge(item.score)}</p>
          <p class="muted">${item.comment || "Комментарий не указан, потому что оценка 9 или выше."}</p>`;
      }

      function renderEvaluation() {
        const openPeriod = state.periods.find((period) => period.status === "OPEN") || state.periods[0];
        const generalCriterion = state.criteria.find((criterion) => criterion.name === "Общая оценка взаимодействия") || state.criteria[0];
        const evaluatorId = state.user.role === "LEADER" ? state.user.departmentId : state.departments[0]?.id;
        document.getElementById("evaluationView").innerHTML = `
          <div class="toolbar"><div><h1>Заполнение оценки</h1><div class="muted">Оценки ниже 9 сохраняются только с комментарием.</div></div></div>
          <section class="section card">
            <div id="evalMessage"></div>
            <div class="form-grid">
              <label><span>Период</span><select id="evalPeriod">${state.periods.map((p) => `<option value="${p.id}" ${openPeriod && p.id === openPeriod.id ? "selected" : ""}>${periodLabel(p)} · ${p.status === "OPEN" ? "открыт" : "закрыт"}</option>`).join("")}</select></label>
              <label><span>Кто оценивает</span><select id="evalEvaluator" ${state.user.role === "LEADER" ? "disabled" : ""}>${state.departments.map((dep) => `<option value="${dep.id}" ${dep.id === evaluatorId ? "selected" : ""}>${dep.name}</option>`).join("")}</select></label>
              <label><span>Кого оценивают</span><select id="evalEvaluatee">${state.departments.filter((dep) => dep.id !== evaluatorId).map((dep) => `<option value="${dep.id}">${dep.name}</option>`).join("")}</select></label>
              <label><span>Критерий</span><select id="evalCriterion">${state.criteria.map((c) => `<option value="${c.id}" ${generalCriterion && c.id === generalCriterion.id ? "selected" : ""}>${c.name}</option>`).join("")}</select></label>
              <label><span>Оценка</span><input id="evalScore" type="number" min="1" max="10" value="9" oninput="toggleCommentRequired()" /></label>
              <div class="message">При оценке ниже 9 комментарий обязателен.</div>
            </div>
            <label style="display:block;margin-top:14px"><span>Комментарий</span><textarea id="evalComment" rows="4" placeholder="Опишите причину низкой оценки"></textarea></label>
            <button class="btn primary" style="margin-top:14px" onclick="saveEvaluation()">Сохранить оценку</button>
          </section>
          <section class="section card table-wrap">
            <h2>Последние оценки</h2>
            <table>
              <thead><tr><th>Кто оценивает</th><th>Кого оценивают</th><th>Оценка</th><th>Комментарий</th></tr></thead>
              <tbody>${state.dashboard.evaluations.map((item) => `<tr><td>${item.evaluatorDepartmentName}</td><td>${item.evaluateeDepartmentName}</td><td>${scoreBadge(item.score)}</td><td>${item.comment || "—"}</td></tr>`).join("")}</tbody>
            </table>
          </section>`;
      }

      function saveEvaluation() {
        const score = Number(document.getElementById("evalScore").value);
        const comment = document.getElementById("evalComment").value.trim();
        const message = document.getElementById("evalMessage");
        if (score < 9 && !comment) {
          message.innerHTML = `<div class="error">Для оценки ниже 9 комментарий обязателен.</div>`;
          return;
        }
        callServer("submitEvaluation", {
          emailOverride: state.emailOverride,
          periodId: document.getElementById("evalPeriod").value,
          evaluatorDepartmentId: document.getElementById("evalEvaluator").value,
          evaluateeDepartmentId: document.getElementById("evalEvaluatee").value,
          criterionId: document.getElementById("evalCriterion").value,
          score,
          comment
        })
          .then(() => {
            message.innerHTML = `<div class="message">Оценка сохранена.</div>`;
            refreshDashboard();
          })
          .catch((error) => (message.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`));
      }

      function renderCompletion() {
        const d = state.dashboard;
        document.getElementById("completionView").innerHTML = `
          ${renderToolbar("Контроль заполнения", d.selectedPeriod ? periodLabel(d.selectedPeriod) : "")}
          <section class="section grid grid-4">
            ${metric("Всего ожидается", d.expectedCount)}
            ${metric("Заполнено", d.matrixEvaluations.length)}
            ${metric("Осталось", d.missingCount)}
            ${metric("Статус", d.selectedPeriod && d.selectedPeriod.status === "OPEN" ? "Открыт" : "Закрыт")}
          </section>
          <section class="section card table-wrap">
            <table><thead><tr><th>Подразделение</th><th>Статус</th><th>Заполнено</th><th>Осталось</th></tr></thead>
            <tbody>${d.completion.map((row) => `<tr><td><b>${row.department.name}</b></td><td>${row.isComplete ? "Заполнено" : "Не заполнено"}</td><td>${row.filled}</td><td>${row.missing}</td></tr>`).join("")}</tbody></table>
          </section>`;
      }

      function renderAdmin() {
        if (state.user.role !== "ADMIN") return;
        document.getElementById("adminView").innerHTML = `
          <div class="toolbar"><div><h1>Админ-панель</h1><div class="muted">Справочники, периоды, руководители и экспорт.</div></div></div>
          <section class="section grid grid-2">
            ${adminDepartments()}
            ${adminCriteria()}
          </section>
          <section class="section grid grid-2">
            ${adminPeriods()}
            ${adminUsers()}
          </section>`;
      }

      function adminDepartments() {
        return `<div class="card"><h2>Подразделения</h2>
          <div class="form-grid" style="grid-template-columns:1fr 120px auto"><input id="depName" placeholder="Название"><input id="depShort" placeholder="Кратко"><button class="btn primary" onclick="adminCall('addDepartment',{name:val('depName'),shortName:val('depShort')})">Добавить</button></div>
          ${state.departments.map((dep) => `<p><b>${dep.name}</b> <span class="muted">${dep.shortName}</span> <button class="btn danger" onclick="adminCall('deleteDepartment',{id:'${dep.id}'})">Удалить</button></p>`).join("")}
        </div>`;
      }

      function adminCriteria() {
        return `<div class="card"><h2>Критерии</h2>
          <div class="form-grid" style="grid-template-columns:1fr 1fr auto"><input id="critName" placeholder="Название"><input id="critDesc" placeholder="Описание"><button class="btn primary" onclick="adminCall('addCriterion',{name:val('critName'),description:val('critDesc')})">Добавить</button></div>
          ${state.criteria.map((crit) => `<p><b>${crit.name}</b> <span class="muted">${crit.description || ""}</span> <button class="btn danger" onclick="adminCall('deleteCriterion',{id:'${crit.id}'})">Удалить</button></p>`).join("")}
        </div>`;
      }

      function adminPeriods() {
        return `<div class="card"><h2>Периоды</h2>
          <div class="form-grid" style="grid-template-columns:1fr 120px auto"><select id="periodMonth">${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}">${monthName(i + 1)}</option>`).join("")}</select><input id="periodYear" type="number" value="${new Date().getFullYear()}"><button class="btn primary" onclick="adminCall('openPeriod',{month:Number(val('periodMonth')),year:Number(val('periodYear'))})">Открыть</button></div>
          ${state.periods.map((period) => `<p><b>${periodLabel(period)}</b> <span class="muted">${period.status === "OPEN" ? "Открыт" : "Закрыт"}</span> <button class="btn" onclick="adminCall('setPeriodStatus',{id:'${period.id}',status:'${period.status === "OPEN" ? "CLOSED" : "OPEN"}'})">${period.status === "OPEN" ? "Закрыть" : "Открыть"}</button></p>`).join("")}
        </div>`;
      }

      function adminUsers() {
        return `<div class="card"><h2>Руководители</h2>
          <div class="form-grid"><input id="userName" placeholder="ФИО"><input id="userEmail" placeholder="Email"><select id="userDepartment">${state.departments.map((dep) => `<option value="${dep.id}">${dep.name}</option>`).join("")}</select></div>
          <button class="btn primary" style="margin-top:10px" onclick="adminCall('addUser',{name:val('userName'),email:val('userEmail'),role:'LEADER',departmentId:val('userDepartment')})">Назначить</button>
          <table style="margin-top:14px"><thead><tr><th>Имя</th><th>Email</th><th>Роль</th></tr></thead><tbody>${state.users.map((u) => `<tr><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td></tr>`).join("")}</tbody></table>
        </div>`;
      }

      function adminCall(name, payload) {
        payload.emailOverride = state.emailOverride;
        callServer(name, payload)
          .then(() => google.script.run.withSuccessHandler(loadState).getInitialData(state.emailOverride))
          .catch((error) => alert(error.message));
      }

      function val(id) {
        return document.getElementById(id).value;
      }

      function metric(label, value) {
        return `<div class="card"><div class="muted">${label}</div><div class="metric">${value}</div></div>`;
      }

      function scoreTone(score) {
        if (score === null || score === undefined || score === "") return "empty";
        if (Number(score) >= 9) return "ok";
        if (Number(score) >= 8) return "warn";
        return "risk";
      }

      function scoreBadge(score) {
        return `<span class="badge ${scoreTone(score)}">${fixed(score)}</span>`;
      }

      function fixed(value) {
        return value === null || value === undefined || isNaN(Number(value)) ? "—" : Number(value).toFixed(2);
      }

      function roleLabel(role) {
        return { ADMIN: "Администратор", LEADER: "Руководитель", VIEWER: "Просмотр" }[role] || role;
      }

      function monthName(month) {
        return ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"][Number(month) - 1];
      }

      function periodLabel(period) {
        return `${monthName(period.month)} ${period.year}`;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (s) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[s]));
      }

      function showFatal(error) {
        document.body.innerHTML = `<main class="wrap"><div class="error">${escapeHtml(error.message || error)}</div></main>`;
      }

      init();
    </script>
  </body>
</html>
